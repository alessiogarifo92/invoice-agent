[project]
name = "invoice-agent-synth"
version = "0.1.0"
description = "Deterministic synthetic invoice generator (PDF + ground truth) for invoice-agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=30.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pdfplumber>=0.11",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["synth", "tests"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
