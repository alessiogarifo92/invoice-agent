name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make verify
  # LLM-backed jobs (evals) are added by later tickets. They must carry
  # `if: github.event.pull_request.head.repo.full_name == github.repository`
  # so that PRs from forks never see the CI keys.
