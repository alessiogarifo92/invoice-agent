name: db-setup

# Brings the Neon database up to the code on main: migrations, the restricted `app` role and its
# grants, and the synthetic master data. Every step is idempotent, so it is safe to run again
# after any merge that adds a migration. Manual only: it writes to the production database.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   NEON_OWNER_DATABASE_URL  owner connection string (already set)
#   APP_ROLE_PASSWORD        password of the `app` role; must match the one inside Render's
#                            DATABASE_URL, because this run sets the role's password to it
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-setup
  cancel-in-progress: false

jobs:
  db-setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER_DATABASE_URL: ${{ secrets.NEON_OWNER_DATABASE_URL }}
      APP_ROLE_PASSWORD: ${{ secrets.APP_ROLE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
      - run: uv sync --frozen
        working-directory: backend
      - name: Check secrets are set
        run: |
          test -n "$OWNER_DATABASE_URL" || { echo "NEON_OWNER_DATABASE_URL is missing"; exit 1; }
          test -n "$APP_ROLE_PASSWORD" || { echo "APP_ROLE_PASSWORD is missing"; exit 1; }
      - name: Migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: App role and grants
        working-directory: backend
        run: uv run python scripts/create_app_role.py
      - name: Synthetic master data
        working-directory: backend
        run: uv run python scripts/load_master_data.py
